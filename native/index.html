<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css" />
  <title>Authorisation form</title>
</head>

<body>
  <header>Шапка</header>
  <main class="flex-all-center">
    <div class="card">
      <h4>Sign in</h4>
      <div class="auth-social-buttons">
        <button class="button">Войти через vk</button>
        <button class="button">Войти через discord</button>
      </div>
      <h4>Вход по паролю</h4>
      <div class="auth-fields">
        <input placeholder="Введите email" class="input outline" type="email">
        <input placeholder="Введите пароль" class="input outline " type="password">
        <div class="flex-all-center">
          <input id="remember-me" type="checkbox">
          <label class="remember-me-label" for="remember-me">Сохранить вход</label>
        </div>
      </div>
      <div class="auth-buttons">
        <button class="button">Войти</button>
        <button class="button">Создать аккаунт</button>
      </div>
    </div>
  </main>
  <footer>footer</footer>
</body>

</html>
